aid: myra-vision
name: Myra Vision
description: 'Myra Vision, Inc. is a clinical-stage ophthalmic medical device company
  headquartered in Campbell, California, and a privately held portfolio company of
  the Shifamed LLC medical device incubator. It develops the Calibreye Titratable Glaucoma
  Therapy (TGT) Surgical System, an aqueous shunt for patients with moderate to severe
  glaucoma whose valve-controlled outflow channels use shape-memory nitinol and can
  be reversibly opened or closed in-office with a transcorneal laser, letting a clinician
  titrate intraocular pressure after implantation rather than committing to a fixed
  flow at the time of surgery. The company completed first-in-human use of the Calibreye
  System in 2023, received FDA conditional approval of its Investigational Device Exemption
  in August 2025, and enrolled the first patient in its US ADAPT clinical study in
  January 2026. As a medical device manufacturer its product is a physical implant
  and a surgical procedure, not software: Myra Vision publishes no public developer
  API, SDK, developer portal, or machine-readable API specification, and this profile
  captures its corporate identity and public web properties in the API Evangelist network.'
